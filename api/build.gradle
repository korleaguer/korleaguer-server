// api 모듈: 화면용 API. 컨트롤러, 화면 조립, 화면용 계산 규칙, 응답. DB만 읽는다.
// core만 안다. 요청 중에 밖을 부르는 단 하나의 예외(공 영상 주소)도 core의 video.PlayVideoFinder 인터페이스로만 안다
// (구현은 client 모듈, ARCHITECTURE.md §3 '문 하나'). batch와 client를 모른다.
// 실행 파일은 만들지 않고 라이브러리 jar만 만든다.
plugins {
	id 'java-library'
	id 'io.spring.dependency-management'
}

group = 'com.korleaguer'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// Spring Boot 플러그인은 실행 파일을 만드는 app에만 건다. 라이브러리 버전만 같은 BOM으로 맞춘다.
dependencyManagement {
	imports {
		mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
	}
}

dependencies {
	implementation project(':core')
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	// 캐시 채우기 상태를 헬스 체크에 내보낸다
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// api 안쪽 구조 규칙 검사(ARCHITECTURE.md §5). 모듈 사이 경계는 Gradle이, 모듈 안쪽은 이 테스트가 막는다
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Spring Boot 플러그인이 해 주던 것을 여기서는 직접 건다(core/build.gradle과 같다).
// -parameters: 리포지토리 @Query의 이름 붙은 인자와 @RequestParam 이름을 메서드 인자 이름으로 잇는다.
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs.add('-parameters')
}

tasks.named('test') {
	useJUnitPlatform()
}
