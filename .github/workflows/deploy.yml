# 지속 배포: develop에 병합(푸시)되면 사람 손 없이 서버까지 나간다.
#   테스트(ci.yml) → 이미지(GHCR, 이름표는 커밋 해시 sha-1a2b3c4) → 서버 무중단 교체(deploy/korleaguer-deploy)
#   → 성공하면 main을 배포한 커밋에 맞춘다.
# 배포는 커밋 해시로 구분한다(따로 버전 번호를 두지 않는다). 배포 기록은 Actions의 deploy 실행 목록이다.
# 배포가 실패하면 서버는 옛 것 그대로다. 고친 뒤 다시 병합하거나 실패한 실행을 '다시 실행'한다.
# 문서·테스트만 바뀐 푸시(*.md, deploy/, src/test/)는 배포하지 않는다.
# 되돌리기: Actions → deploy → Run workflow에 되돌릴 커밋(예 1a2b3c4)을 넣으면 그 커밋의 이미지로 다시 배포한다
# (서버에 최근 3개 이미지가 있고, 그보다 오래된 것은 GHCR에서 받는다).
#
# 필요한 값(저장소 Settings → Secrets and variables → Actions). 자세한 준비는 deploy/README.md.
#   secret   DEPLOY_SSH_KEY       배포 계정용 SSH 개인키(이 저장소 전용, 서버에서는 'api 배포'만 할 수 있게 묶여 있다)
#   variable DEPLOY_HOST          서버 주소(예: pigeon.ddns.net)
#   variable DEPLOY_KNOWN_HOSTS   서버 호스트 키 한 줄(server-setup.sh가 출력). 처음 보는 서버에는 접속하지 않는다
#   variable DEPLOY_PORT          SSH 포트(없으면 22)
#   variable DEPLOY_PLATFORM      서버 CPU(linux/amd64 또는 linux/arm64, 없으면 linux/amd64). arm64면 ARM 러너에서 바로 만든다
name: deploy

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - 'deploy/**'
      - 'src/test/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      commit:
        description: 되돌리거나 다시 배포할 커밋(예 1a2b3c4). 이 워크플로가 그 커밋으로 만든 이미지가 있어야 한다
        required: true

# 배포는 한 번에 하나씩, 도는 중인 배포는 끊지 않는다(기다리던 배포가 여럿이면 가장 새 것만 남는다).
# 서버에서도 두 저장소의 배포가 겹치지 않게 잠근다(korleaguer-deploy).
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/korleaguer/korleaguer-server

jobs:
  test:
    name: 테스트
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  build:
    name: 이미지 만들기
    needs: test
    runs-on: ${{ vars.DEPLOY_PLATFORM == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 이미지 이름표(커밋 해시)
        id: tag
        run: |
          echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 이름표는 sha-1a2b3c4 하나다. latest는 쓰지 않는다(무엇이 나가 있는지 늘 커밋으로 안다).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}

      # SBOM(이미지에 든 패키지 목록)과 출처 증명(어느 커밋·워크플로가 만들었나)을 이미지와 함께 올린다.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 서버에 배포
    needs: build
    # 병합이면 이미지를 만든 뒤, 수동 실행(되돌리기)이면 테스트·이미지 만들기를 건너뛰고 바로 배포한다.
    if: always() && ((github.event_name == 'push' && needs.build.result == 'success') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: 배포할 이미지
        id: tag
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            commit="$(printf '%s' "${INPUT_COMMIT#sha-}" | tr 'A-F' 'a-f')"
            [[ "$commit" =~ ^[0-9a-f]{7,40}$ ]] || { echo "커밋 해시(예 1a2b3c4)가 아닙니다: $INPUT_COMMIT"; exit 1; }
            tag="sha-${commit:0:7}"
          else
            tag="$BUILT_TAG"
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"
          echo "배포할 이미지: ${IMAGE}:${tag}"
        env:
          EVENT: ${{ github.event_name }}
          INPUT_COMMIT: ${{ inputs.commit }}
          BUILT_TAG: ${{ needs.build.outputs.tag }}

      - name: SSH 준비
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "DEPLOY_SSH_KEY·DEPLOY_HOST·DEPLOY_KNOWN_HOSTS를 먼저 등록하세요(deploy/README.md)"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}

      # 서버는 이 키로 'korleaguer-deploy api'만 실행한다. 보내는 명령은 이미지 이름표뿐이고,
      # 표준입력으로 이 job의 임시 토큰(packages:read)을 넘겨 GHCR에서 이미지를 받게 한다(job이 끝나면 만료).
      # 서버가 새 컨테이너를 옛 것과 겹쳐 띄워 healthy가 되면 바꾸고, 안 되면 옛 것을 그대로 둔다(바꾸기 전 DB 백업).
      - name: 배포
        run: |
          printf '%s\n%s\n' "$GITHUB_ACTOR" "$GHCR_TOKEN" | ssh \
            -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            "deploy@${DEPLOY_HOST}" "$TAG"
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          TAG: ${{ steps.tag.outputs.value }}

      - name: SSH 키 지우기
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: 요약
        run: |
          echo "### API 배포 완료: ${TAG}" >> "$GITHUB_STEP_SUMMARY"
        env:
          TAG: ${{ steps.tag.outputs.value }}

  main:
    name: main을 배포한 커밋에 맞추기
    needs: deploy
    if: github.event_name == 'push' && needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # main은 '지금 서버에 나가 있는 코드'다. 배포한 커밋을 main에 병합해 둔다(이미 들어 있으면 그대로).
      - name: main에 병합
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/merges" \
            -f base=main -f head="$GITHUB_SHA" \
            -f commit_message="chore(deploy): ${GITHUB_SHA::7} 배포를 main에 반영" --silent \
            || echo "::warning::main에 병합하지 못했습니다. 배포는 끝났으니 main만 직접 맞추세요"
        env:
          GH_TOKEN: ${{ github.token }}
