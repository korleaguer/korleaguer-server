# 임시: 이 비공개 저장소에서 ARM 러너(ubuntu-24.04-arm)를 쓸 수 있는지 확인한다. 확인 뒤 지운다.
name: arm-runner-check
on:
  push:
    branches: ['feature/#35']
permissions:
  contents: read
jobs:
  arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - run: uname -m && docker version --format '{{.Server.Arch}}'
