# 전체 테스트(./gradlew test). PR마다 돌고, develop에 병합되면 배포 워크플로(deploy.yml)가 배포 전에 이 워크플로를 부른다.
# 그래서 같은 커밋을 두 번 테스트하지 않는다(develop·main 푸시에 따로 돌지 않는다. 아래 push는 gradle 파일이 바뀐 병합만이다).
# 빨간불은 코드·테스트가 실제로 깨졌을 때만 켠다. 라이브러리 내려받기가 바깥 탓으로 막힌 것은 다시 해 본다(gradlew-retry.sh).
name: CI

on:
  pull_request:
    branches: [develop, main]
  # 라이브러리 목록이나 Gradle 버전이 바뀐 병합 때만 develop에서 한 번 더 돈다. PR이 꺼내 쓰는 Gradle 캐시를 새로 저장하려는 것이다.
  # 캐시 이름에 워크플로 이름이 들어가서(setup-gradle), 'CI'라는 이름으로 develop에서 돈 실행만 PR용 캐시를 저장한다.
  # PR 실행은 읽기만 하고, 배포가 부를 때는 이름이 deploy라 캐시가 따로다. 이 push가 없으면 PR 캐시가 옛 라이브러리 목록에 멈춰
  # PR마다 새 라이브러리를 Maven Central에서 다시 받고, 가끔 429(요청 너무 많음)로 실패한다(2026-11-18·19·23).
  push:
    branches: [develop]
    paths:
      - '**/*.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/ci.yml'
  workflow_call:

# PR에 새 커밋이 오면 그 PR의 이전 실행은 취소한다. 배포에서 부를 때는 실행마다 따로라 취소하지 않는다.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: corretto
          java-version: 21

      # Gradle 내려받기·의존성 캐시. v6부터 캐시 부분이 별도 약관(비공개 gradle-actions-caching)에 동의해야 해서 v5에 둔다.
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # 여러 테스트가 함께 쓰는 DB를 운영과 같은 MySQL로 돌린다(app/build.gradle). H2로 잘못 돌면 TestDatabaseTest가 실패한다.
      - name: 테스트
        env:
          KORLEAGUER_TEST_DB: mysql
        run: .github/scripts/gradlew-retry.sh test

      # 실패하면 어떤 테스트가 깨졌는지 보고서를 내려받을 수 있게 남긴다.
      - name: 테스트 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: |
            core/build/reports/tests/test
            client/build/reports/tests/test
            batch/build/reports/tests/test
            api/build/reports/tests/test
            app/build/reports/tests/test
          retention-days: 7

  # 이 PR의 응답 모양 명세(openapi.json)로 웹(develop)의 타입을 만들어 검사한다. 웹이 쓰는 응답 필드를 지우거나 바꾸면 여기서 실패한다.
  # 웹은 이 명세에서 타입을 만든다(korleaguer-web의 npm run api:types). PR에서만 돈다(배포는 막지 않는다).
  web-types:
    name: 웹 타입 검사
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: korleaguer/korleaguer-web
          ref: develop
          path: web
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 웹 의존성 설치
        working-directory: web
        run: npm ci

      - name: 이 PR의 응답 명세로 웹 타입 검사
        working-directory: web
        run: |
          cp ../openapi.json openapi/server.json
          npm run api:types
          npx next typegen
          if ! npx tsc --noEmit; then
            echo "::error::이 PR의 응답 모양 변경이 웹(develop)이 쓰는 필드를 깨뜨린다. 웹을 먼저 새 모양에도 맞게 고쳐 develop에 넣은 뒤 다시 돌린다"
            exit 1
          fi
