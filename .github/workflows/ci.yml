# 전체 테스트(./gradlew test). PR마다 돌고, develop에 병합되면 배포 워크플로(deploy.yml)가 배포 전에 이 워크플로를 부른다.
# 그래서 같은 커밋을 두 번 테스트하지 않는다(develop·main 푸시에 따로 돌지 않는다).
name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_call:

# PR에 새 커밋이 오면 그 PR의 이전 실행은 취소한다. 배포에서 부를 때는 실행마다 따로라 취소하지 않는다.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: corretto
          java-version: 21

      # Gradle 내려받기·의존성 캐시
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: 테스트
        run: ./gradlew test

      # 실패하면 어떤 테스트가 깨졌는지 보고서를 내려받을 수 있게 남긴다.
      - name: 테스트 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
