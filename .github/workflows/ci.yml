# 전체 테스트(./gradlew test). PR마다 돌고, develop에 병합되면 배포 워크플로(deploy.yml)가 배포 전에 이 워크플로를 부른다.
# 그래서 같은 커밋을 두 번 테스트하지 않는다(develop·main 푸시에 따로 돌지 않는다).
name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_call:

# PR에 새 커밋이 오면 그 PR의 이전 실행은 취소한다. 배포에서 부를 때는 실행마다 따로라 취소하지 않는다.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: corretto
          java-version: 21

      # Gradle 내려받기·의존성 캐시. v6부터 캐시 부분이 별도 약관(비공개 gradle-actions-caching)에 동의해야 해서 v5에 둔다.
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: 테스트
        run: ./gradlew test

      # 실패하면 어떤 테스트가 깨졌는지 보고서를 내려받을 수 있게 남긴다.
      - name: 테스트 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
