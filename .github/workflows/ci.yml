# PR과 develop·main 푸시마다 전체 테스트(./gradlew test)를 돌린다.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21

      # Gradle 내려받기·의존성 캐시
      - uses: gradle/actions/setup-gradle@v4

      - name: 테스트
        run: ./gradlew test

      # 실패하면 어떤 테스트가 깨졌는지 보고서를 내려받을 수 있게 남긴다.
      - name: 테스트 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
