# 한국인 메이저리거 역대 기록(기록 탭, 이슈 #177)에 넣는 선수 중 지금 명단(baseball.yml)에 없는 선수.
# 지금 명단 선수는 따로 적지 않아도 들어간다. 기록은 mlb-id로 MLB 공식 Stats API의 시즌별 기록(yearByYear)을 받는다
# (이 선수들은 처음 한 번만, 명단 선수는 하루 한 번).
#   name-ko: 화면에 쓰는 한글 이름
#   mlb-id: MLB 공식 선수 번호(mlb.com/player/번호)
#   role: hitter(타자 기록으로 순위에 넣음) / pitcher(투수 기록으로)
# 고른 기준(2026-11-17): MLB 1994~2026 시즌 선수 목록에서 출생 국가가 한국인 선수. MLB 자료에 출생 국가가 빠진
# 강정호는 손으로 더했고, 한국에서 태어난 미국 국적 선수(Tommy Phelps, Rob Refsnyder)는 뺐다.
korean-mlb:
  past:
