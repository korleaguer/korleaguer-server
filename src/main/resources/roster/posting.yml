# KBO → MLB 포스팅. 사람이 공식 보도(MLB Trade Rumors·MLB.com·구단 발표)를 보고 적는다.
# 숫자(시각·날짜·금액)는 근거 기사(source) 원문으로 확인한 값만 넣는다. 잘못 적으면 앱이 뜰 때 바로 실패한다(Postings).
#
# current: 이번 겨울 포스팅된 선수. 비시즌 홈에 협상 마감 60일 뒤까지 보이고, 그 뒤에는 history로 옮긴다.
#   name-ko / kbo-team / position-ko / birth-year: 화면에 그대로 쓰는 값
#   search-names: 관련 기사를 고를 때 기사 제목에서 찾는 이름(한글 이름은 자동으로 들어간다). 영어 표기는 매체마다 달라 여럿 적는다.
#   window-opens: 30일 협상 시작 시각(MLB가 구단들에 공시한 다음 날 오전 8시, 미국 동부)
#   deadline: 협상 마감 시각(30일째 오후 5시, 미국 동부). 11월 첫 일요일부터는 표준시(-05:00)다.
#   source: 공시·마감 시각의 근거 기사
#   slug: 영문 짧은 이름(사진 주소에 쓴다, 예: si-hwan-roh). photo-url이 있으면 꼭 적는다
#   photo-url: 프로필 사진 원본 주소(선택, KBO 공식 선수 등록 사진: KBO 사진 서버의 그 시즌 사진). 우리 서버가 한 번 받아 호스팅한다.
#              없으면 화면이 구단 색 원에 이름 첫 글자를 보인다
#   result: 결과가 나면 적는다. outcome은 SIGNED(계약) 또는 NO_DEAL(결렬).
#           SIGNED면 mlb-team(약어, 예: SD), agreed-on(합의 보도 미국 날짜), years(보장 연수), guaranteed-usd(보장액)를 같이 적는다.
#
# history: 지금 포스팅 제도(2018년 KBO·MLB 합의, 30일 동안 모든 구단과 협상)에서 MLB 구단과 계약한 기록.
#   결렬(나성범 2020·김재환 2019)은 화면에 넣지 않기로 해 적지 않는다(사용자 결정 11-11). agreed-on이 없으면 결렬로 읽는다.
#   season: 포스팅된 겨울이 시작한 해(2023-24 겨울이면 2023)
#   deadline: 협상 마감 미국 날짜, agreed-on: 계약 합의가 처음 보도된 미국 날짜
#   years·guaranteed-usd: 보장 연수와 보장액(달러). 옵션·인센티브는 넣지 않는다.
#   kbo-id: KBO 선수 번호(한국어 위키백과 선수 문서의 KBO 기록 링크 playerId). 있으면 season 시즌의 KBO 공식 등록 사진
#           (포스팅 당시 구단의 마지막 시즌, 정면)을 우리 서버가 KBO 사진 서버에서 한 번 받아 호스팅한다. 권리는 KBO·구단에 있다.
