# 관련 기사를 받을 피드. robots.txt가 우리 수집기를 허용한 곳만 적는다(수집기도 받을 때마다 다시 확인한다).
# 2026-11-11 사용자 결정: 비상업 개인 서비스이고 출처·원문 링크를 밝히며 기사를 통째로 옮기지 않으므로, 약관 문구만으로
# 빼지 않고 robots.txt가 허용하고 피드(RSS·뉴스 사이트맵)를 공개한 언론사는 모두 넣는다.
# 쓰는 것: 제목, 앞부분 몇 줄(200자 안팎), 대표 사진의 원본 주소(파일은 받지 않는다), 언론사·발행 시각, 원문 링크.
# AI 요약은 robots.txt가 Claude 계열 수집기까지 허용한 출처(preview: ai)만 한다. 언론사가 원하지 않으면 여기서 뺀다.
#
# 2026-11-11 조사(언론사 52곳 robots.txt·RSS, 피드가 없는 야구 매체 10곳 뉴스 사이트맵):
#   - robots.txt가 우리를 막아 넣지 않은 곳: 서울신문, 아시아경제, 스타뉴스, MBC. 네이버·구글 뉴스도 막는다.
#   - 피드도 사이트맵도 없어 넣지 않은 곳(목록 페이지를 긁어야 함): OSEN, 스포츠서울, 중앙일보, 한국일보, 데일리안, YTN, KBS 등.
#   - 영어 출처 중 ESPN·Yahoo Sports·New York Post·연합뉴스 영문은 robots.txt가 AI 수집기를 막아 요약할 수 없어 넣지 않았다.
#
#   publisher: 화면에 쓰는 언론사 이름
#   feed-url: 피드 주소(RSS·Atom 또는 뉴스 사이트맵)
#   zone: 발행 시각에 시간대 표시가 없을 때 쓸 시간대(비우면 Asia/Seoul)
#   subject: 선수 한 명만 다루는 피드면 그 선수 한글 이름(제목에 이름이 없어도 그 선수 기사로 본다)
#   interval: 다시 받는 최소 간격. 비우면 깨어날 때마다(30분). 큰 피드는 길게 둔다.
#   preview: 제목 아래 보여 줄 것. 비우면 제목만.
#     lead: 피드가 준 앞부분(없으면 기사 페이지의 og:description). 사진은 피드 사진, 없으면 og:image
#     ai: 기사 페이지를 한 번 받아 대표 사진(og:image) 원본 주소와 Claude 한국어 제목·요약. 본문은 저장하지 않는다
korleaguer:
  news:
    sources:
      # ---- 영어(AI 요약) ----
      # 노시환 선수 태그 피드. Content-Type이 text/html로 오지만 내용은 RSS다. robots.txt에 Crawl-delay: 1
      - publisher: MLB Trade Rumors
        feed-url: https://www.mlbtraderumors.com/players/si-hwan-roh/feed
        subject: 노시환
        preview: ai
      # KBO 태그 피드(새로 포스팅되는 선수도 여기서 잡힌다)
      - publisher: MLB Trade Rumors
        feed-url: https://www.mlbtraderumors.com/korea-baseball-organization/feed
        preview: ai
      - publisher: MLB.com
        feed-url: https://www.mlb.com/feeds/news/rss.xml
        interval: 1h
        preview: ai
      - publisher: CBS Sports
