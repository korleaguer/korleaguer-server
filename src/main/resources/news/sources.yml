# 관련 기사 제목을 받을 피드(RSS). robots.txt가 허용한 곳만 적는다(수집기도 받을 때마다 다시 확인한다).
# 제목·링크·언론사·발행 시각만 쓰고 본문·사진·요약은 쓰지 않는다. 언론사가 원하지 않으면 여기서 빼고 DB의 기사도 지운다.
# 2026-11-11 확인:
#   - 넣지 않은 곳: 네이버(검색·뉴스)·구글 뉴스(robots.txt가 모든 수집기를 막음),
#     OSEN·일간스포츠(저작권 규약이 허가 없는 정보서비스·데이터베이스 이용을 금지), 스타뉴스(무단 이용 단속 공지).
#   - 뉴시스는 11-11에 뺐다: 이용약관 제4장(AI 학습 및 크롤링 제한)이 검색엔진 색인 말고는 자동화 도구로 콘텐츠를
#     모니터링·수집·정리·사용하는 행위와 하이퍼링크 등 데이터 추출을 사전 서면 합의 없이 허용하지 않는다.
#     이미 모은 뉴시스 기사는 응답에서 빠진다(여기 적힌 언론사 기사만 보인다).
#   - 스포츠서울·엑스포츠뉴스·스포티비뉴스·뉴스1은 RSS가 없어 넣지 않았다(목록 페이지를 읽어야 해 구조가 바뀌면 깨진다).
#
#   publisher: 화면에 쓰는 언론사 이름
#   feed-url: 피드 주소
#   zone: 발행 시각에 시간대 표시가 없을 때 쓸 시간대(비우면 Asia/Seoul)
#   subject: 선수 한 명만 다루는 피드면 그 선수 한글 이름(제목에 이름이 없어도 그 선수 기사로 본다)
#   interval: 다시 받는 최소 간격. 비우면 깨어날 때마다(30분). 큰 피드는 길게 둔다.
korleaguer:
  news:
    sources:
      # 노시환 선수 태그 피드. Content-Type이 text/html로 오지만 내용은 RSS다. robots.txt에 Crawl-delay: 1
      - publisher: MLB Trade Rumors
        feed-url: https://www.mlbtraderumors.com/players/si-hwan-roh/feed
        subject: 노시환
      # KBO 태그 피드(새로 포스팅되는 선수도 여기서 잡힌다)
      - publisher: MLB Trade Rumors
        feed-url: https://www.mlbtraderumors.com/korea-baseball-organization/feed
      # 해외야구·야구 피드. 압축 없이 한 번에 약 0.8MB, 2주치가 들어 있어 2시간마다만 받는다(안내: mydaily.co.kr/rss_service)
      - publisher: 마이데일리
        feed-url: https://www.mydaily.co.kr/wbaseball_rss.xml
        interval: 2h
      - publisher: 마이데일리
        feed-url: https://www.mydaily.co.kr/kbo_rss.xml
        interval: 2h
