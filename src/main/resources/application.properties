spring.application.name=api

# DB: production uses MySQL 8 (SPRING_DATASOURCE_URL etc. from the server env, see deploy/).
# Local runs and tests use an H2 file/in-memory DB in MySQL mode with the same Flyway SQL.
spring.datasource.url=jdbc:h2:file:./data/korleaguer-mysql;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
# Store every instant as a plain UTC datetime (MySQL datetime(6)); the same mapping works on H2 in MySQL mode.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.open-in-view=false
# H2 console is off by default. Turn it on with the 'local' profile (see README)
spring.h2.console.enabled=false

# Player roster (Korean names + English search aliases), KBO posting data, news feed list
spring.config.import=classpath:roster/baseball.yml,classpath:roster/posting.yml,classpath:news/sources.yml

# Cache: in memory (Caffeine), expires 60s after write
spring.cache.type=caffeine
spring.cache.cache-names=home,player
spring.cache.caffeine.spec=expireAfterWrite=60s,maximumSize=500

# Actuator: expose health only
management.endpoints.web.exposure.include=health

# App settings
# Season: blank = automatic (this year once MLB's regular season opening day, US date, has passed, otherwise last year;
# March 20 when the opening day is not fetched yet). Set a year only to pin it (tests, manual fix)
korleaguer.season=${KORLEAGUER_SEASON:}
# Data source: mlb (MLB official Stats API, default) | sample (no network, made-up sample data for tests and offline work)
korleaguer.data-source=${KORLEAGUER_DATA_SOURCE:mlb}
# MLB official Stats API (no key). Only the ingest side calls it, max 1 request/second, honest User-Agent.
# MLB's copyright notice allows only individual, non-commercial, non-bulk use. This site is personal and non-commercial
korleaguer.mlb.base-url=https://statsapi.mlb.com
korleaguer.mlb.user-agent=korleaguer/0.1
# Automatic ingest: wakes up every 12 minutes (UTC) and fetches only what is due (see README)
korleaguer.ingest.schedule-enabled=${KORLEAGUER_INGEST_SCHEDULE_ENABLED:true}
korleaguer.ingest.cron=0 */12 * * * *
# Player page: if that player's season is not fetched yet, fetch it right away but wait at most this long
korleaguer.ingest.on-demand-timeout=8s
korleaguer.admin.token=${KORLEAGUER_ADMIN_TOKEN:}
# MLB official player photos: the rights belong to MLB. Get permission before going public, or turn them off (false)
korleaguer.images.official-photos=${KORLEAGUER_OFFICIAL_PHOTOS:true}
# {mlbId} is replaced with the MLB player id from roster/baseball.yml
# silo = the same headshot with the background removed (square), so the web can frame it inside a circle with room around the face
# f_auto = AVIF/WebP with full transparency. Without it the server sends a 256-color PNG with rough, haloed edges
korleaguer.images.player-photo-template=https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:silo:current.png/w_360,q_auto:best,f_auto/v1/people/{mlbId}/headshot/silo/current
# Related news headlines for posted KBO players (title, link, publisher, time only; never article bodies or images).
# Runs only while a posting window is near (3 days before it opens ~ 3 days after the deadline); otherwise no requests.
# Obeys robots.txt for every name below (ours and Claude-family names), 1 request/second per site at most,
# conditional requests, and pauses a site after 401/403/429. Feeds are listed in news/sources.yml
korleaguer.news.enabled=${KORLEAGUER_NEWS_ENABLED:true}
korleaguer.news.cron=0 */30 * * * *
korleaguer.news.user-agent=${KORLEAGUER_NEWS_USER_AGENT:korleaguer/0.1 (news headlines only; personal, non-commercial)}
korleaguer.news.robots-agents=korleaguer,ClaudeBot,Claude-User,Claude-SearchBot,Claude-Web,anthropic-ai
