# Tests: in-memory DB, always sample data (never call MLB), no automatic schedule
spring.datasource.url=jdbc:h2:mem:korleaguer-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
korleaguer.data-source=sample
# Pin the season so tests do not depend on today's date (CurrentSeasonTest covers the automatic rule)
korleaguer.season=2026
korleaguer.ingest.schedule-enabled=false
korleaguer.admin.token=test-admin-token
