// core 모듈: 엔티티·리포지토리(domain), 기본 야구 계산과 변환(support), 포스팅 자료(posting).
// 다른 모듈을 모른다(ARCHITECTURE.md §3). 실행 파일은 만들지 않고 라이브러리 jar만 만든다.
plugins {
	id 'java-library'
	id 'io.spring.dependency-management'
}

group = 'com.korleaguer'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// Spring Boot 플러그인은 실행 파일을 만드는 app에만 건다. 라이브러리 버전만 같은 BOM으로 맞춘다.
dependencyManagement {
	imports {
		mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
	}
}

dependencies {
	// 엔티티와 리포지토리가 JPA·Spring Data 타입을 밖으로 드러내므로 api로 준다(이 모듈을 쓰는 쪽도 같은 타입을 본다)
	api 'org.springframework.boot:spring-boot-starter-data-jpa'
	// 응답 record 필드에 null이 될 수 있다고 적는 표시(@Nullable). 응답 모양 명세(openapi.json)가 이 표시를 읽는다.
	// 응답 record는 api 모듈에도 있어 api로 준다
	api 'org.jspecify:jspecify'
	// 정해진 값만 오는 글자 필드에 값 목록을 적는 표시(@Schema). 응답 모양 명세(openapi.json)가 읽는다.
	// 컴파일 때만 쓰고 운영 실행 파일에는 넣지 않는다(표시 클래스가 없으면 JVM은 그 표시를 건너뛴다)
	compileOnly 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.55'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Spring Boot 플러그인이 app에서 해 주던 것을 여기서는 직접 건다.
// -parameters: 리포지토리 @Query의 이름 붙은 인자(:playerIds)를 메서드 인자 이름으로 잇는다. 없으면 앱이 뜨다 실패한다.
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs.add('-parameters')
}

tasks.named('test') {
	useJUnitPlatform()
}
