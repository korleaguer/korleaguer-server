# Tests: in-memory DB, always sample data (never call MLB), no automatic schedule
# CI runs the shared test DBs on MySQL: KORLEAGUER_TEST_DB=mysql (see app/build.gradle)
spring.datasource.url=${KORLEAGUER_TEST_DB_URL:jdbc:h2:mem:korleaguer-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
korleaguer.data-source=sample
# Pin the season so tests do not depend on today's date (CurrentSeasonTest covers the automatic rule)
korleaguer.season=2026
korleaguer.ingest.schedule-enabled=false
korleaguer.admin.token=test-admin-token
# Never fetch news feeds in tests
korleaguer.news.enabled=false
# Never fetch photos in tests
korleaguer.photos.enabled=false
